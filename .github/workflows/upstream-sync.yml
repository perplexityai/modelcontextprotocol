name: Check upstream for changes

on:
  schedule:
    - cron: '17 7 * * *'  # daily ~07:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: perplexityai/modelcontextprotocol
  UPSTREAM_BRANCH: main
  FORK_BRANCH: main
  ISSUE_LABEL: upstream-sync

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Compute diff with upstream
        id: diff
        run: |
          set -euo pipefail
          UPSTREAM_REF="upstream/${UPSTREAM_BRANCH}"
          AHEAD=$(git rev-list --count "origin/${FORK_BRANCH}..${UPSTREAM_REF}")
          echo "ahead=${AHEAD}" >> "$GITHUB_OUTPUT"
          echo "Upstream is ${AHEAD} commit(s) ahead of fork."

          if [ "${AHEAD}" -eq 0 ]; then
            exit 0
          fi

          # List new upstream commits
          {
            echo 'commits<<EOF'
            git log --pretty=format:'- %h %s (%an)' "origin/${FORK_BRANCH}..${UPSTREAM_REF}"
            echo
            echo EOF
          } >> "$GITHUB_OUTPUT"

          # Try merge in-memory to detect conflicts
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git checkout -b _sync_probe "origin/${FORK_BRANCH}"

          if git merge --no-commit --no-ff "${UPSTREAM_REF}" >/dev/null 2>&1; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
            echo "clean=true" >> "$GITHUB_OUTPUT"
            git merge --abort 2>/dev/null || true
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U || true)
            git merge --abort 2>/dev/null || true
            echo "clean=false" >> "$GITHUB_OUTPUT"
            {
              echo 'conflicts<<EOF'
              echo "${CONFLICTS}"
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync issue
        if: steps.diff.outputs.ahead != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AHEAD: ${{ steps.diff.outputs.ahead }}
          COMMITS: ${{ steps.diff.outputs.commits }}
          CONFLICTS: ${{ steps.diff.outputs.conflicts }}
          CLEAN: ${{ steps.diff.outputs.clean }}
        run: |
          set -euo pipefail
          TITLE="Upstream sync: ${AHEAD} new commit(s) from ${UPSTREAM_REPO}"

          if [ "${CLEAN}" = "true" ]; then
            STATUS="Clean merge — no conflicts detected. You can fast-forward / merge directly."
          else
            STATUS=$'Conflicts detected in:\n```\n'"${CONFLICTS}"$'\n```'
          fi

          BODY=$(cat <<EOF
          Upstream \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\` is **${AHEAD}** commit(s) ahead of \`${FORK_BRANCH}\`.

          ## Status
          ${STATUS}

          ## New upstream commits
          ${COMMITS}

          ## Resolve locally
          \`\`\`bash
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git 2>/dev/null || true
          git fetch upstream ${UPSTREAM_BRANCH}
          git checkout ${FORK_BRANCH}
          git merge upstream/${UPSTREAM_BRANCH}
          # resolve conflicts, then:
          git push origin ${FORK_BRANCH}
          \`\`\`

          _Auto-generated by \`.github/workflows/upstream-sync.yml\`. This issue is updated on each run; close it when sync is complete._
          EOF
          )

          # Pin every gh call to the fork — `git remote add upstream` confuses gh's auto-detection.
          REPO="${GITHUB_REPOSITORY}"

          # Ensure label exists. Idempotent and surfaces real errors.
          if ! gh label list --repo "${REPO}" --json name --jq '.[].name' | grep -qx "${ISSUE_LABEL}"; then
            gh label create "${ISSUE_LABEL}" --repo "${REPO}" --color "ededed" --description "Upstream sync notifications"
          fi

          EXISTING=$(gh issue list --repo "${REPO}" --label "${ISSUE_LABEL}" --state open --json number --jq '.[0].number' || true)

          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --repo "${REPO}" --title "${TITLE}" --body "${BODY}"
            echo "Updated issue #${EXISTING}"
          else
            gh issue create --repo "${REPO}" --title "${TITLE}" --body "${BODY}" --label "${ISSUE_LABEL}"
          fi

      - name: Close stale sync issue
        if: steps.diff.outputs.ahead == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          EXISTING=$(gh issue list --repo "${REPO}" --label "${ISSUE_LABEL}" --state open --json number --jq '.[0].number' || true)
          if [ -n "${EXISTING}" ]; then
            gh issue close "${EXISTING}" --repo "${REPO}" --comment "Fork is now up-to-date with upstream. Closing automatically."
          fi
