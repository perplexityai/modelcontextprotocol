runtime: "container"
build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."
startCommand:
  type: "http"
configSchema:
  type: "object"
  required:
    - "OPENROUTER_API_KEY"
  properties:
    OPENROUTER_API_KEY:
      type: "string"
      description: "Your OpenRouter API key from https://openrouter.ai/keys"
    OPENROUTER_TIMEOUT_MS:
      type: "string"
      description: "Request timeout in milliseconds (default: 300000)"